<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wow vs. Crisis</title>
<style>
  /* Summit branding: purples and logo strip from the B6GS 2026 slide template. */
  :root { --bg: #3d1b57; --fg: #f6f2fa; --muted: #c4b5d3; --card: #ffffff12; --wow: #f5b700; --crisis: #ff4d4d;
          --p1: #59297a; --p2: #6c3195; --p3: #a94de7; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: var(--fg);
         font: 16px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
         background: linear-gradient(180deg, var(--p2) 0%, var(--p1) 260px, var(--bg) 640px); }
  main { flex: 1; width: 100%; max-width: 480px; margin: 0 auto; padding: 20px 16px; }
  footer { padding: 14px 16px; display: flex; justify-content: center;
           background: linear-gradient(90deg, var(--p1), var(--p2) 50%, var(--p3)); }
  footer img { width: 100%; max-width: 420px; height: auto; }
  .eyebrow { color: var(--muted); font-size: .85rem; letter-spacing: .02em; margin: 0 0 2px; }
  h1 { font-size: 1.8rem; font-weight: 300; margin: 0 0 4px; }
  h1 .w { color: var(--wow); font-weight: 600; } h1 .c { color: var(--crisis); font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .q { background: var(--card); border: 1px solid #ffffff1f; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .q h2 { margin: 0 0 4px; font-size: 1.25rem; }
  .q p { margin: 0 0 12px; color: var(--muted); font-size: .92rem; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .grid button { font: inherit; font-size: 1.25rem; padding: 12px 0; border-radius: 8px;
                 border: 1px solid #ffffff2e; background: #ffffff14; color: var(--fg); }
  #wow button.on { background: var(--wow); border-color: var(--wow); color: #000; }
  #crisis button.on { background: var(--crisis); border-color: var(--crisis); color: #000; }
  #submit { width: 100%; font: inherit; font-size: 1.2rem; font-weight: 600; padding: 14px;
            border: 0; border-radius: 10px; color: #fff;
            background: linear-gradient(90deg, var(--p2), var(--p3)); }
  #submit:disabled { opacity: .35; }
  #msg { text-align: center; margin-top: 12px; min-height: 1.4em; }
  .closed { text-align: center; padding: 48px 0; color: var(--muted); font-size: 1.1rem; }
</style>
</head>
<body>
<main>
<p class="eyebrow">Brooklyn AI-Native 6G Summit</p>
<h1><span class="w">Wow</span> vs. <span class="c">Crisis</span></h1>
<p class="sub" id="sub">University panel</p>

<div id="form" hidden>
  <div class="q">
    <h2>Wow</h2>
    <p>How much has AI amazed you this year? (1 = meh, 10 = mind blown)</p>
    <div class="grid" id="wow"></div>
  </div>
  <div class="q">
    <h2>Crisis</h2>
    <p>How much has it made you wonder what's left for you? (1 = not at all, 10 = updating my LinkedIn)</p>
    <div class="grid" id="crisis"></div>
  </div>
  <button id="submit" disabled>Submit</button>
  <div id="msg"></div>
</div>
<div id="closed" class="closed">Voting isn't open right now. Hang tight!</div>
</main>
<footer><img src="/brand/logos.png" alt="Nokia · NYU WIRELESS · NYU Tandon School of Engineering · IEEE ComSoc"></footer>

<script>
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const load = (k) => { try { return JSON.parse(store.get(k)); } catch { return null; } };

  let voter = store.get('voter');
  if (!voter) {
    voter = Math.random().toString(36).slice(2) + Date.now().toString(36);
    store.set('voter', voter);
  }

  const pick = { wow: null, crisis: null };
  let round = null;
  const $ = (id) => document.getElementById(id);

  for (const field of ['wow', 'crisis']) {
    for (let i = 1; i <= 10; i++) {
      const b = document.createElement('button');
      b.textContent = i;
      b.onclick = () => { pick[field] = i; render(); };
      $(field).appendChild(b);
    }
  }

  function render() {
    for (const field of ['wow', 'crisis']) {
      [...$(field).children].forEach((b, i) => b.classList.toggle('on', pick[field] === i + 1));
    }
    $('submit').disabled = !(pick.wow && pick.crisis);
  }

  $('submit').onclick = async () => {
    try {
      const r = await fetch('/api/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ voter, ...pick }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Something went wrong');
      store.set('vote' + j.round, JSON.stringify(pick));
      $('msg').textContent = 'Got it! You can change your vote until voting closes.';
    } catch (e) {
      $('msg').textContent = e.message;
    }
  };

  async function poll() {
    try {
      const s = await (await fetch('/api/state')).json();
      if (s.round !== round) {
        round = s.round;
        const mine = load('vote' + round);
        const prefill = mine || (round === 2 ? load('vote1') : null);
        pick.wow = prefill?.wow ?? null;
        pick.crisis = prefill?.crisis ?? null;
        $('msg').textContent = mine ? 'Your vote is in. You can change it until voting closes.' : '';
        $('sub').textContent = round === 2 ? 'Round 2: has your score changed?' : 'University panel';
        render();
      }
      $('form').hidden = !s.open;
      $('closed').hidden = s.open;
    } catch {}
    setTimeout(poll, 3000);
  }
  poll();
</script>
</body>
</html>
